<main class="flex min-h-screen w-full flex-col lg:flex-row bg-white custom-dark">
  <!-- Flag Video Section - Visible on all screens but layout changes -->
  <div class="relative flex h-[40vh] w-full items-center justify-center overflow-hidden lg:h-auto lg:w-1/2">
    <video autoplay muted loop playsinline class="absolute h-full w-full object-cover">
      <source src="/redflag.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
    <div class="relative z-10 flex flex-col items-center justify-center p-6 text-center text-white drop-shadow-lg">
      <h1 class="mb-2 text-4xl font-bold md:text-5xl lg:text-6xl xl:text-7xl">Crowdsourced Facebook</h1>
      <h2 class="text-4xl font-bold md:text-5xl lg:text-6xl xl:text-7xl">Scam Detector</h2>
      <p class="italic mt-4 text-xl md:text-2xl lg:text-3xl text-gray-200 max-w-xl">
            Built by users, powered by reports — uncovering scams in real time.
    </p>
    </div>
  </div>

<div
  class="hidden lg:block absolute top-0 left-1/2 h-full w-6 -translate-x-3 pointer-events-none"
  style="background: linear-gradient(to right, transparent, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.4), transparent);">
</div>

  <!-- Sign-in Form Section -->
  <div class="flex w-full px-5 items-center justify-center  py-12 lg:w-1/2 lg:py-0 ">
    <div class="w-full max-w-md rounded-2xl bg-red-800 px-8 py-12 shadow-xl sm:px-10 sm:py-16 md:max-w-lg">
      <div class="mb-10 text-center">
        <h2 class="text-3xl font-bold text-white">Welcome Back!</h2>
        <p class="mt-2 text-white">Sign in to your account to continue</p>
      </div>
      
      <form [formGroup]="signInForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-medium text-white">Email</label>
          <div class="mt-1">
            <input 
              id="email" 
              type="email" 
              formControlName="email" 
              placeholder="Enter Email Address" 
              class="block w-full rounded-lg text-black border-gray-300 bg-white px-4 py-3 shadow-sm focus:border-red-500 focus:ring-red-500 custom-dark dark:text-white dark-hover"
              required
            />
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-white">Password</label>
          <div class="mt-1">
            <input 
              id="password" 
              type="password" 
              formControlName="password" 
              placeholder="Enter Password" 
              class="block w-full rounded-lg text-black border-gray-300 bg-white px-4 py-3 shadow-sm focus:border-red-500 focus:ring-red-500 custom-dark dark:text-white dark-hover"
              required
            />
          </div>
        </div>

        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 rounded border-gray-300 text-red-600 focus:ring-red-500 custom-dark dark:text-white dark-hover">
            <label for="remember-me" class="ml-2 block text-sm text-white hover:text-black cursor-pointer">Remember me</label>
          </div>

          <div class="text-sm">
            <a href="#" class="font-medium text-white hover:text-black">Forgot password?</a>
          </div>
        </div>

        @if (errorMessage) {
          <div class="rounded-md bg-red-50 p-4">
            <div class="flex">
              <div class="ml-3">
                <h3 class="text-sm font-medium text-red-800">{{ errorMessage }}</h3>
              </div>
            </div>
          </div>
        }

        <div>
          <button 
            type="submit" 
            class="flex w-full justify-center rounded-lg bg-yellow-600 px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-gray-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-600"
          >
            Sign in
          </button>
        </div>
      </form>

      <div class="mt-8 text-center text-sm text-white">
        <p>Don't have an account? <a href="#" class="font-medium text-white hover:text-red-500">Sign up</a></p>
      </div>
    </div>
  </div>
</main>
