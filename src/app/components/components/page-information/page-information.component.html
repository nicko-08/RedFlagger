<main class="main-container custom-dark mx-auto flex w-full flex-1 flex-col bg-white p-3 sm:w-5/5 md:w-4/5 lg:w-4/5">
    <div class="div1 custom-dark">
      <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
      <div class="div2">
        <h3 class="overview">OVERVIEW</h3>
        <!-- Button to redirect to post-report-reviews -->
        <button (click)="navigateToPostReportReviews()" 
          class="viewreport-btn">
          View Report Reviews
        </button>
      </div>
      <div class="div3-container">
        <!-- Left Card -->
        <div class="div3">
          <div class="frame-container">
            <iframe
              [src]="fbEmbedUrl"
              class="w-full max-w-[500px] h-[150px]"
              style="border: none;"
              scrolling="no"
              frameborder="0"
              allowfullscreen="true"
              allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share">
            </iframe>
          </div>
          <h2 class="pagename">{{pageName}}</h2>
          <div class="pagename-div">
            <span class="threat-level">{{threatLevel}}/10 🚩</span>
          </div>
        </div>
        <!-- Right Card -->
        <div class="right-card">
          <!-- Flag Design -->
          <div class="right-card-div">
            <div class="right-card-div-container">
              <svg width="100" height="100" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
                <rect x="75" width="69" height="500" rx="34.5" [attr.fill]="threatHex" />
                <path fill-rule="evenodd" clip-rule="evenodd"
                  d="M219.75 305.535L204.315 311.941L131 342.367L131 262.989L131 107.378L131 28L204.3 58.42C204.305 58.4221 204.31 58.4242 204.315 58.4263L219.75 64.8318L391.796 136.232C435.375 154.318 435.375 216.05 391.795 234.136L219.75 305.535Z"
                  [attr.fill]="threatHex" />
              </svg>
            </div>
          </div>
          <!-- Stats -->
          <div class="stats-container">
            <div class="reports">
                <p class="reports-txt">Total Reports</p>
                <span class="reports-count">
                  {{reportTotal}}</span>
            </div>
            <div class="reports">
                <p class="reports-txt md:mt-3">Peak Daily Reports</p>
                <span class="reports-count">
                  {{peakReport}}</span>
            </div>
            <div class="reports">
                <p class="reports-txt md:mt-1 xl:mt-1 lg:mt-1">Average Daily Reports</p>
                <span class="reports-count">
                  {{averagePostCount}}</span>
            </div>
        </div>
      </div>
    </div>
      <!-- Chart Section -->
        <!-- Circular Design and Charts -->
          <!-- Charts Section -->
            <div class="chart-1 mt-2 mb-2">  
              <canvas id="myChart" class="charts"></canvas>
            </div>
          <div class="chart-2">
        <canvas id="myChart2" class="charts"></canvas>
    </div>
  </div>
</main>
