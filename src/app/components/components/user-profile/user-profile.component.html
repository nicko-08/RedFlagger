<main class="custom-dark main-container cursor-default">

  <!-- Profile Banner with Video -->
  <div class="profile-banner">
    <div class="profile-banner-video-wrapper">
      <video autoplay loop muted playsinline class="profile-banner-video">
        <source src="/redflag.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <div class="profile-banner-overlay"></div>
    </div>
  </div>

  <!-- Profile Section Floating -->
  <div class="profile-section-floating">
    <div class="profile-section-row">

      <!-- Profile Image -->
      <div class="profile-image-container" (click)="showProfilePicturePopup = true">
        <img [src]="'icons/' + userProfileImage + '.svg'" alt="Profile" class="profile-image"/>
        <div class="profile-image-edit">Change</div>
      </div>

      <!-- Username and Edit -->
      <div class="profile-username-edit md:mt-8 mt-1">
        <h1 class="heading1-big">{{ username }}</h1>
        <button aria-label="Edit" (click)="showProfileUsernamePopup = true" class="edit-profile-btn">
          <img [src]="'edit.svg'" class="edit-icon-light" alt="Edit" />
          <img [src]="'edit-dark.svg'" class="edit-icon-dark" alt="Edit" />
          <span class="edit-profile-text">Edit</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Tabs Section -->
  <section class="profile-tabs-section">
    <div class="tabs-container">
      <div class="tabs-row">
        <button class="tab-btn" [class.active-tab]="activeTab === 'reports'" (click)="activeTab = 'reports'">
          Reports
        </button>
        <button class="tab-btn" [class.active-tab]="activeTab === 'reviews'" (click)="activeTab = 'reviews'">
          Reviews
        </button>
      </div>
      <div class="tab-content">
        <app-report-user-profile *ngIf="activeTab === 'reports'" [userId]="userId"></app-report-user-profile>
        <app-review-user-profile *ngIf="activeTab === 'reviews'" [userId]="userId"></app-review-user-profile>
      </div>
    </div>
  </section>

  <!-- Popups -->
  <app-profile-image-select *ngIf="showProfilePicturePopup" 
    (closePopup)="showProfilePicturePopup = false"
    (imageSaved)="onImageSaved()"
    [currentImage]="userProfileImage">
  </app-profile-image-select>
  <app-profile-settings *ngIf="showProfileUsernamePopup" 
    (closePopup)="onUsernameSaved()">
  </app-profile-settings>
</main>
