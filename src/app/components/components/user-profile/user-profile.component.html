<main class="custom-dark main-container cursor-default">

  <!-- Profile Section -->
  <section class="profile-section dark-card-glow card-hover">
    <div class="profile-image-wrapper">
      <div class="profile-image-container group hover:scale-105"
        (click)="showProfilePicturePopup = true">
        <img [src]="'icons/' + userProfileImage + '.svg'"
          alt="Profile icon"
          class="profile-image group-hover:blur-sm"/>
        <div class="profile-image-edit group-hover:opacity-100">
          Change
        </div>
      </div>
    </div>

    <div class="profile-username-group">
      <h1 class="heading1-big">{{ username }}</h1>
      <button aria-label="Edit"
        (click)="showProfileUsernamePopup = true"
        class="edit-profile-btn cursor-pointer">
        <img [src]="'edit.svg'" class="mr-2 w-5 h-5 block dark:hidden invert brightness-0" alt="Edit" />
        <img [src]="'edit-dark.svg'" class="w-5 h-5 hidden dark:block" alt="Edit" />
        <span class="text-lg">Edit</span>
      </button>
    </div>
  </section>

  <!-- Tabs Section -->
  <section class="outer-wrapper dark-card-glow card-hover mt-0 hover:from-gray-200 hover:to-gray-300">
    <div class="tabs-container">
      <div class="flex border-b border-gray-700 dark:border-gray-600 mb-4">
        <button
          class="tab-btn cursor-pointer"
          [class.active-tab]="activeTab === 'reports'"
          (click)="activeTab = 'reports'"
          aria-label="Show Reports">
          Reports
        </button>
        <button
          class="tab-btn cursor-pointer"
          [class.active-tab]="activeTab === 'reviews'"
          (click)="activeTab = 'reviews'"
          aria-label="Show Reviews">
          Reviews
        </button>
      </div>
      <div class="tab-content">
        <app-report-user-profile *ngIf="activeTab === 'reports'" [userId]="userId"></app-report-user-profile>
        <app-review-user-profile *ngIf="activeTab === 'reviews'" [userId]="userId"></app-review-user-profile>
      </div>
    </div>
  </section>

  <!-- Popups -->
  <app-profile-image-select *ngIf="showProfilePicturePopup" 
    (closePopup)="showProfilePicturePopup = false"
    (imageSaved)="onImageSaved()"
    [currentImage]="userProfileImage"></app-profile-image-select>
  <app-profile-settings *ngIf="showProfileUsernamePopup" 
    (closePopup)="onUsernameSaved()"></app-profile-settings>
</main>
