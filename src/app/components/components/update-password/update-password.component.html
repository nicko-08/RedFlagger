<div class="max-w-md mx-auto mt-10 p-6 bg-white rounded-xl shadow-md">
  <h2 class="text-2xl font-semibold mb-4 text-center">Update Password</h2>

  <form (ngSubmit)="updatePassword()" class="space-y-4">
    <div>
      <label for="newPassword" class="block text-sm font-medium text-gray-700">New Password:</label>
      <input
        type="password"
        id="newPassword"
        name="newPassword"
        [(ngModel)]="newPassword"
        required
        minlength="6"
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
      />
    </div>

    <button
      type="submit"
      class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200"
    >
      Update Password
    </button>
  </form>


  <p *ngIf="message" class="text-green-600 mt-4 text-center font-medium">{{ message }}</p>
  <p *ngIf="error" class="text-red-600 mt-4 text-center font-medium">{{ error }}</p>
</div>
