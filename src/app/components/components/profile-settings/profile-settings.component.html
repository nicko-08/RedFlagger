<div class="fixed inset-0 z-50 flex items-center justify-center">

  <div class="absolute inset-0 bg-black/30 backdrop-blur-sm" (click)="close()"></div>
  <div class="relative z-10 w-3xl mx-auto rounded-lg shadow-lg p-6 border-1 border-gray-400 dark-card">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 dark:text-white">Change Username</h1>

    <!-- Username Form -->
    <div *ngIf="showUsernameForm" class="space-y-4">

      <div>
        <input
          type="text"
          [(ngModel)]="newUsername"
          placeholder="Enter a New Username for your Account"
          class="w-full border border-gray-300 rounded px-3 py-2 text-black dark:text-white placeholder-gray-400 dark:placeholder-gray-500"
        />
      </div>
    </div>

    <!-- Buttons -->
    <div class="flex justify-between items-center mt-6">
      <button
        (click)="close()"
        class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition"
      >
        Cancel
      </button>

      <button
        (click)="saveChanges()"
        [disabled]="!newUsername"
        class="px-6 py-2 
          bg-blue-600 
          text-white rounded 
          hover:bg-blue-700 
          disabled:bg-gray-500 
          disabled:cursor-not-allowed"
      >
        Save
      </button>
    </div>
  </div>
</div>
