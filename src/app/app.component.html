<div class="relative min-h-screen flex flex-col">
  <!-- Header with high z-index -->
  <div class="relative z-50">
    <app-header (startLogout)="showLogoutLoading()"></app-header>
  </div>

  <!-- Dark mode button - adjust z-index to be below header but above content -->
  <button
    (click)="toggleDarkMode()"
    class="absolute top-40 right-4 z-40 rounded-full bg-gray-500 p-2 shadow-sm flex items-center justify-center md:top-25 md:right-15 cursor-pointer"
    aria-label="Toggle Dark Mode">
    <!-- Moon icon: black in light mode -->
    <img
      *ngIf="!isDarkMode"
      src="dark.svg"
      alt="Dark Mode"
      class="w-6 h-6 filter brightness-0 drop-shadow-[0_0_4px_rgba(0,0,0,0.6)]"
    />
    <!-- Sun icon: soft yellow in dark mode -->
    <img
      *ngIf="isDarkMode"
      src="light.svg"
      alt="Light Mode"
      class="w-6 h-6 filter invert sepia saturate-1000 hue-rotate-40 brightness-180 contrast-90"/>
  </button>

  <!-- Main content with lower z-index -->
  <main class="flex-1 relative z-30">
    <div #pageContainer>
      <router-outlet></router-outlet>
      <div *ngIf="logoutLoading" class="fixed inset-0 bg-black bg-opacity-60 z-[9999] flex items-center justify-center">
  <div class="text-white text-lg flex flex-col items-center gap-3">
    <svg class="animate-spin h-10 w-10 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8v4l3-3-3-3v4a8 8 0 100 16v-4l-3 3 3 3v-4a8 8 0 01-8-8z"></path>
    </svg>
    <span>Logging out...</span>
  </div>
</div>
    </div>
  </main>

  <!-- Footer -->
  <div class="relative z-40">
    <app-footer></app-footer>
  </div>
</div>
